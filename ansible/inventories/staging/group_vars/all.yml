---
# Variables communes à toutes les machines de « staging »
taiga_env: staging
aws_region: eu-west-3

# Toutes les machines privées sont jointes en passant par le bastion (ProxyJump).
# L'IP du bastion est lue dans l'inventaire dynamique : rien à écrire en dur.
ansible_ssh_common_args: >-
  -o ProxyJump=ubuntu@{{ hostvars[groups['role_bastion'][0]]['public_ip_address'] }}

# Secrets lus dans Parameter Store au moment où ils sont utilisés (ADR-09).
# Aucune valeur n'est écrite dans le dépôt. Toujours utiliser no_log: true
# dans les tâches qui manipulent ces variables.
taiga_secrets:
  postgres_password: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/postgres_password', region=aws_region) }}"
  secret_key: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/secret_key', region=aws_region) }}"
  rabbitmq_pass: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/rabbitmq_pass', region=aws_region) }}"
  rabbitmq_erlang_cookie: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/rabbitmq_erlang_cookie', region=aws_region) }}"
  email_host_password: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/email_host_password', region=aws_region) }}"

# Taiga sur le staging : adresse publique, images à déployer et compte du registre
taiga_domaine: staging.taiga-ledevagilles.fr
taiga_etiquette_back: staging-c5652c3e
taiga_etiquette_front: staging-99eda755
taiga_registre_utilisateur: gitlab+deploy-token-16742214

# Comptes recréés par le rôle taiga après chaque reconstruction (mots de passe générés par terraform/socle)
taiga_admin_nom: admin # compte de service, pas le nom d'une personne
taiga_admin_email: admin@example.com # adresse unique exigée par Taiga ; sur le staging, Mailpit reçoit tout
taiga_admin_mdp: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/admin_password', region=aws_region) }}"
taiga_e2e_mdp: "{{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/e2e_password', region=aws_region) }}"