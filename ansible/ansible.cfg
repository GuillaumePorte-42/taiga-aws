[defaults]
roles_path          = ./roles
remote_user         = ubuntu        ; utilisateur des AMI Ubuntu
interpreter_python  = auto_silent   ; masque l'avertissement sur l'interpréteur Python
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, ini

[ssh_connection]
; accept-new : accepte automatiquement l'empreinte d'une machine jamais vue,
; mais refuse une empreinte qui aurait changé (protection contre l'usurpation)
; ControlMaster : réutilise la connexion SSH, beaucoup plus rapide via le bastion
ssh_args   = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s