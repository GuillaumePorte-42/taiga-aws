server {
    listen 80 default_server;

    client_max_body_size 100M;
    charset utf-8;
    # Redirections relatives : nginx ne sait pas que le visiteur est en HTTPS (l'ALB a déchiffré), il écrirait sinon « http://… »
    absolute_redirect off;
    # DNS interne de Docker (Compose et Swarm) : les noms sont relus toutes les 10 s, pas une seule fois au démarrage
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Noms des services dans des variables : avec une variable, nginx résout le nom à la requête, pas au démarrage
    set $taiga_front     taiga-front;
    set $taiga_back      taiga-back;
    set $taiga_protected taiga-protected;
    set $taiga_events    taiga-events;

    # Frontend
    location / {
        proxy_pass http://$taiga_front;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $http_x_forwarded_proto;
    }

    # API
    location /api/ {
        proxy_pass http://$taiga_back:8000;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $http_x_forwarded_proto;
    }

    # Admin
    location /admin/ {
        deny all;
    }

    # Static
    location /static/ {
        alias /taiga/static/;
    }

    # Media
    location /_protected/ {
        internal;
        alias /taiga/media/;
        add_header Content-disposition "attachment";
    }

    # Unprotected section
    location /media/exports/ {
        alias /taiga/media/exports/;
        add_header Content-disposition "attachment";
    }

    location /media/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /media/xxx devient /xxx pour taiga-protected (ce que faisait le « / » final de l'ancien proxy_pass)
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$taiga_protected:8003;
        proxy_redirect off;
    }

    # Events
    location /events {
        proxy_pass http://$taiga_events:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
