---
- name: Mettre à jour la liste des paquets et les paquets installés
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # pas de nouvelle mise à jour du cache pendant 1 h : plus rapide au 2e passage
    upgrade: safe

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_paquets }}"
    state: present

- name: Régler le fuseau horaire
  community.general.timezone:
    name: "{{ common_fuseau_horaire }}"

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
