---
# Les handlers ne s'exécutent qu'une fois, en fin de playbook, et seulement si une tâche a changé quelque chose
- name: Redémarrer SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Redémarrer node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true
