---
# Vérifie qu'Ansible lit les secrets de Parameter Store, SANS jamais les afficher :
# seule la longueur de chaque valeur est montrée.
# ansible-playbook playbooks/check_secrets.yml -e taiga_env=staging
- name: Vérifier la lecture des secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    taiga_env: staging
    aws_region: eu-west-3
    secret_names:
      - postgres_password
      - secret_key
      - rabbitmq_pass
      - rabbitmq_erlang_cookie
      - email_host_password
  tasks:
    - name: Longueur de chaque secret
      ansible.builtin.debug:
        msg: >-
          {{ item }} : {{ lookup('amazon.aws.aws_ssm', '/taiga/' ~ taiga_env ~ '/' ~ item,
          region=aws_region) | length }} caractères
      loop: "{{ secret_names }}"
